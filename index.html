<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b18">
  <title>Mini Golf — Forest Course</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Mini Golf home">
        <span class="brand-mark" aria-hidden="true">⛳</span>
        <span>MINI <strong>GOLF</strong></span>
      </a>
      <div class="topbar-actions">
        <button class="icon-button" id="soundButton" type="button" aria-label="Nyalakan atau matikan suara">♪</button>
        <button class="text-button" id="restartButton" type="button">Ulangi hole</button>
      </div>
    </header>

    <section class="game-layout" aria-label="Permainan mini golf">
      <aside class="score-card" aria-label="Papan skor">
        <p class="eyebrow">Forest course</p>
        <div class="hole-heading">
          <span>HOLE</span>
          <strong id="holeNumber">1</strong>
          <span class="hole-total">/ 3</span>
        </div>
        <div class="score-grid">
          <div><span>PAR</span><strong id="parValue">3</strong></div>
          <div><span>STROKES</span><strong id="strokeValue">0</strong></div>
        </div>
        <div class="score-grid">
          <div><span>BEST</span><strong id="highScoreValue">-</strong></div>
          <div><span>BEST/HOLE</span><strong id="highScoreHoleValue">-</strong></div>
        </div>
        <div class="progress-label"><span>Course progress</span><span id="progressText">0%</span></div>
        <div class="progress-track"><span id="progressBar"></span></div>
        <p class="tip"><span>TIP</span> Tarik bola ke belakang, arahkan, lalu lepaskan.</p>
      </aside>

      <div class="game-stage" id="gameStage">
        <canvas id="gameCanvas" width="960" height="600" aria-label="Lapangan mini golf"></canvas>
        <div class="status-pill" id="statusPill" aria-live="polite">Giliranmu</div>
        <div class="power-meter" id="powerMeter" aria-hidden="true">
          <span>POWER</span><div><i id="powerFill"></i></div>
        </div>
        <section class="modal" id="resultModal" hidden>
          <div class="modal-card">
            <p class="eyebrow" id="resultEyebrow">Hole selesai</p>
            <h1 id="resultTitle">Nice shot!</h1>
            <p id="resultSummary"></p>
            <button class="primary-button" id="nextButton" type="button">Hole berikutnya →</button>
          </div>
        </section>
      </div>
    </section>

    <footer><span>Drag</span> untuk membidik <i></i> <span>Release</span> untuk memukul</footer>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
